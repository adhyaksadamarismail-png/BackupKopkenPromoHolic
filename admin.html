<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROMO.HOLIC — Admin Panel Realtime</title>

  <!-- Google Fonts & Feather Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Environment Configuration & SDK -->
  <script src="js/env.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <div class="admin-wrapper">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="admin-sidebar">
      <div>
        <div class="sidebar-brand">
          <div class="brand-logo-row">
            <span style="font-size: 20px;">🔥</span>
            <span class="brand-title">PROMO<span style="color: #0F172A;">.HOLIC</span></span>
          </div>
          <span class="brand-sub">Admin Panel</span>
        </div>

        <ul class="sidebar-nav">
          <li>
            <button class="nav-item-btn" data-menu="status-toko">
              <i data-feather="home"></i>
              <span>Status Toko</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-menu="rekap">
              <i data-feather="bar-chart-2"></i>
              <span>Rekap Penjualan</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn active" data-menu="riwayat">
              <i data-feather="clock"></i>
              <span>Riwayat Order</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-menu="cgv">
              <i data-feather="film"></i>
              <span>CGV Admin</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="btn-logout" id="btn-admin-logout">
          <i data-feather="log-out"></i>
          <span>Keluar</span>
        </button>
      </div>
    </aside>


    <!-- ==================== MAIN CONTENT AREA ==================== -->
    <main class="admin-main">

      <!-- Top Header Row -->
      <div class="top-header-row">
        <div class="header-title-box">
          <h1>Riwayat Order</h1>
          <p>Kelola semua pesanan masuk dan konfirmasi pesanan di sini.</p>
        </div>

        <button class="date-filter-btn" id="btn-date-filter">
          <i data-feather="calendar"></i>
          <span id="current-date-filter-text">26 Agu 2026 - 26 Agu 2026</span>
          <i data-feather="chevron-down"></i>
        </button>
      </div>

      <!-- Stat Cards Grid (Realtime Calculated) -->
      <div class="stat-cards-grid">
        <div class="stat-card orange">
          <div class="stat-icon-wrapper">
            <i data-feather="refresh-cw"></i>
          </div>
          <div>
            <div class="stat-info-title">Belum Diproses</div>
            <div class="stat-info-val-row">
              <span class="stat-val-num" id="stat-count-belum">0</span>
              <span class="stat-val-sub">order baru</span>
            </div>
          </div>
        </div>

        <div class="stat-card blue">
          <div class="stat-icon-wrapper">
            <i data-feather="edit-3"></i>
          </div>
          <div>
            <div class="stat-info-title">Diproses</div>
            <div class="stat-info-val-row">
              <span class="stat-val-num" id="stat-count-diproses">0</span>
              <span class="stat-val-sub">order</span>
            </div>
          </div>
        </div>

        <div class="stat-card green">
          <div class="stat-icon-wrapper">
            <i data-feather="check-circle"></i>
          </div>
          <div>
            <div class="stat-info-title">Sudah Diproses</div>
            <div class="stat-info-val-row">
              <span class="stat-val-num" id="stat-count-sudah">0</span>
              <span class="stat-val-sub">order</span>
            </div>
          </div>
        </div>

        <div class="stat-card gray">
          <div class="stat-icon-wrapper">
            <i data-feather="shopping-bag"></i>
          </div>
          <div>
            <div class="stat-info-title">Semua Order</div>
            <div class="stat-info-val-row">
              <span class="stat-val-num" id="stat-count-semua">0</span>
              <span class="stat-val-sub">order</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Status Filter Pills -->
      <div class="filter-pills-row">
        <button class="filter-status-pill active" data-status-filter="BELUM_DIPROSES">
          Belum Diproses (<span id="pill-count-belum">0</span>)
        </button>
        <button class="filter-status-pill" data-status-filter="DIPROSES">
          Diproses (<span id="pill-count-diproses">0</span>)
        </button>
        <button class="filter-status-pill" data-status-filter="SUDAH_DIPROSES">
          Sudah Diproses (<span id="pill-count-sudah">0</span>)
        </button>
        <button class="filter-status-pill" data-status-filter="ALL">
          Semua (<span id="pill-count-semua">0</span>)
        </button>
      </div>

      <!-- Search & Sort Row -->
      <div class="search-sort-row">
        <div class="search-input-wrapper">
          <i data-feather="search"></i>
          <input 
            type="text" 
            id="admin-search-input" 
            class="search-input-field" 
            placeholder="Cari nama, nomor HP, atau menu..." 
          />
        </div>

        <select id="admin-sort-select" class="sort-dropdown">
          <option value="newest">⇅ Terbaru</option>
          <option value="oldest">⇅ Terlama</option>
          <option value="pickup">⇅ Pickup Terdekat</option>
        </select>
      </div>

      <!-- Order Cards List Container -->
      <div class="orders-cards-list" id="admin-orders-list-container">
        <!-- Rendered via JS -->
      </div>

      <!-- Pagination Footer -->
      <div class="pagination-wrapper">
        <button class="page-btn">‹ Sebelumnya</button>
        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
        <span style="color: var(--admin-text-sub); font-size: 13px;">...</span>
        <button class="page-btn">6</button>
        <button class="page-btn">Selanjutnya ›</button>
      </div>

    </main>

  </div>


  <!-- ==================== MODALS ==================== -->

  <!-- Full Receipt Lightbox Modal -->
  <div class="admin-modal-overlay" id="modal-full-receipt">
    <div class="admin-modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 16px; font-weight: 800;">Bukti Receipt Pembayaran</h3>
        <button id="btn-close-receipt-modal" style="background: none; border: none; font-size: 18px; cursor: pointer;">✕</button>
      </div>
      <img id="lightbox-receipt-img" src="" alt="Receipt" class="receipt-full-img" />
      <button class="btn-admin-action-primary" id="btn-close-receipt-modal-2">Tutup</button>
    </div>
  </div>

  <!-- Admin Login Modal (Supabase Auth) -->
  <div class="admin-modal-overlay" id="modal-admin-auth">
    <div class="admin-modal-box" style="max-width: 380px; text-align: center;">
      <div style="font-size: 32px; margin-bottom: 8px;">🔒</div>
      <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 6px;">Login Admin Promo.Holic</h3>
      <p style="font-size: 12px; color: var(--admin-text-sub); margin-bottom: 20px;">Silakan login untuk mengelola pesanan realtime.</p>
      
      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; text-align: left;">
        <div>
          <label style="font-size: 12px; font-weight: 700; color: var(--admin-text-sub);">Email / ID Admin</label>
          <input type="text" id="auth-admin-email" value="admin@promoholic.id" class="search-input-field" style="padding-left: 12px; margin-top: 4px;" />
        </div>
        <div>
          <label style="font-size: 12px; font-weight: 700; color: var(--admin-text-sub);">Password</label>
          <input type="password" id="auth-admin-password" value="admin123" class="search-input-field" style="padding-left: 12px; margin-top: 4px;" />
        </div>
      </div>

      <button class="btn-admin-action-primary" id="btn-submit-auth">Masuk ke Panel Admin</button>
    </div>
  </div>


  <!-- ==================== ADMIN JAVASCRIPT ==================== -->
  <script type="module">
    import { 
      fetchAllOrders, 
      updateOrderStatus, 
      uploadReceiptImage, 
      subscribeAdminOrders,
      loginAdmin,
      logoutAdmin,
      getAdminSession
    } from './js/data/supabase.js';

    let adminOrders = [];
    let currentFilter = 'BELUM_DIPROSES';
    let searchQuery = '';
    let sortOrder = 'newest';

    function formatRupiah(val) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val || 0);
    }

    function formatDateDisplay(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const dateNum = String(d.getDate()).padStart(2, '0');
      const monthStr = months[d.getMonth()];
      const yearNum = d.getFullYear();
      const hours = String(d.getHours()).padStart(2, '0');
      const mins = String(d.getMinutes()).padStart(2, '0');
      return `${dateNum} ${monthStr} ${yearNum} • ${hours}.${mins}`;
    }

    async function initAdminApp() {
      // Check Auth via Supabase Session or stored token
      const session = await getAdminSession();
      const isLogged = localStorage.getItem('promoholic_admin_logged');
      if (!session && !isLogged) {
        document.getElementById('modal-admin-auth').classList.add('active');
      }

      document.getElementById('btn-submit-auth').addEventListener('click', async () => {
        const email = document.getElementById('auth-admin-email').value.trim();
        const password = document.getElementById('auth-admin-password').value.trim();
        try {
          await loginAdmin(email, password);
          localStorage.setItem('promoholic_admin_logged', 'true');
          document.getElementById('modal-admin-auth').classList.remove('active');
          location.reload();
        } catch (err) {
          // Fallback for simple admin login if auth provider isn't set up yet
          if (email === 'admin@promoholic.id' && password === 'admin123') {
            localStorage.setItem('promoholic_admin_logged', 'true');
            document.getElementById('modal-admin-auth').classList.remove('active');
          } else {
            alert("Login Gagal: " + err.message);
          }
        }
      });

      document.getElementById('btn-admin-logout').addEventListener('click', async () => {
        await logoutAdmin();
        localStorage.removeItem('promoholic_admin_logged');
        location.reload();
      });

      // Load initial orders
      try {
        adminOrders = await fetchAllOrders();
        renderDashboardStats();
        renderOrdersList();
      } catch (err) {
        alert("Gagal terhubung ke database Supabase:\n" + err.message);
      }

      // Subscribe to Realtime Updates
      subscribeAdminOrders(
        (updatedOrders) => {
          adminOrders = updatedOrders;
          renderDashboardStats();
          renderOrdersList();
        },
        (err) => {
          console.warn("Realtime admin subscription notice:", err);
        }
      );

      // Event bindings
      setupEvents();
    }

    function renderDashboardStats() {
      const belumCount = adminOrders.filter(o => o.status === 'BELUM_DIPROSES').length;
      const diprosesCount = adminOrders.filter(o => o.status === 'DIPROSES').length;
      const sudahCount = adminOrders.filter(o => o.status === 'SUDAH_DIPROSES' || o.status === 'SELESAI').length;
      const semuaCount = adminOrders.length;

      document.getElementById('stat-count-belum').textContent = belumCount;
      document.getElementById('stat-count-diproses').textContent = diprosesCount;
      document.getElementById('stat-count-sudah').textContent = sudahCount;
      document.getElementById('stat-count-semua').textContent = semuaCount;

      document.getElementById('pill-count-belum').textContent = belumCount;
      document.getElementById('pill-count-diproses').textContent = diprosesCount;
      document.getElementById('pill-count-sudah').textContent = sudahCount;
      document.getElementById('pill-count-semua').textContent = semuaCount;
    }

    function renderOrdersList() {
      const container = document.getElementById('admin-orders-list-container');
      if (!container) return;

      let list = adminOrders.filter(o => {
        if (currentFilter === 'ALL') return true;
        if (currentFilter === 'SUDAH_DIPROSES') return o.status === 'SUDAH_DIPROSES' || o.status === 'SELESAI';
        return o.status === currentFilter;
      });

      // Search filter
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(o => {
          const matchName = (o.customer_name || '').toLowerCase().includes(q);
          const matchPhone = (o.phone_number || '').includes(q);
          const matchOutlet = (o.outlet || '').toLowerCase().includes(q);
          const matchId = (o.order_id || '').toLowerCase().includes(q);
          const matchMenu = JSON.stringify(o.items || []).toLowerCase().includes(q);
          return matchName || matchPhone || matchOutlet || matchId || matchMenu;
        });
      }

      // Sort filter
      if (sortOrder === 'newest') {
        list.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      } else if (sortOrder === 'oldest') {
        list.sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
      }

      if (list.length === 0) {
        container.innerHTML = `
          <div style="background: #FFFFFF; border: 1.5px solid var(--admin-border); border-radius: var(--admin-radius-lg); padding: 40px; text-align: center; color: var(--admin-text-sub);">
            Tidak ada pesanan pada kategori ini.
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(order => renderOrderCard(order)).join('');

      if (window.feather) window.feather.replace();
      bindCardActions(container);
    }

    function renderOrderCard(order) {
      const statusClassMap = {
        'BELUM_DIPROSES': 'status-belum-diproses',
        'DIPROSES': 'status-diproses',
        'SUDAH_DIPROSES': 'status-sudah-diproses',
        'SELESAI': 'status-sudah-diproses',
        'DIBATALKAN': 'status-belum-diproses'
      };

      const statusColorMap = {
        'BELUM_DIPROSES': 'orange',
        'DIPROSES': 'blue',
        'SUDAH_DIPROSES': 'green',
        'SELESAI': 'green',
        'DIBATALKAN': 'orange'
      };

      const colorScheme = statusColorMap[order.status] || 'orange';
      const cleanPhone = (order.phone_number || '').trim().replace(/[^0-9]/g, '');
      const waUrl = cleanPhone ? `https://wa.me/${cleanPhone.startsWith('0') ? '62' + cleanPhone.slice(1) : cleanPhone}` : '#';

      return `
        <div class="admin-order-card ${statusClassMap[order.status] || ''}" data-order-id="${order.order_id}">
          
          <!-- Card Header Top -->
          <div class="card-header-top">
            <div class="card-header-left">
              <span class="order-id-badge ${colorScheme}">${order.order_id}</span>
              <span class="order-status-pill ${colorScheme}">${order.status_label || 'Belum Diproses'}</span>
            </div>
            <div class="order-time-text">${formatDateDisplay(order.created_at)}</div>
          </div>

          <!-- Card Body 3 Columns Layout -->
          <div class="card-body-grid">
            
            <!-- Col 1: Customer Info -->
            <div class="col-customer-info">
              <div class="customer-name-row">${order.customer_name || 'Pelanggan'}</div>
              <div class="customer-phone-row">
                <span>${order.phone_number || '-'}</span>
                ${cleanPhone ? `<a href="${waUrl}" target="_blank" class="btn-mini-wa" title="Chat WA">💬</a>` : ''}
              </div>
              <div class="customer-outlet-row">
                📍 ${order.outlet || 'Outlet Belum Ditentukan'}
              </div>
              ${order.pickup_time ? `<div style="font-size: 11px; color: var(--admin-text-sub);">⏰ Pickup: ${order.pickup_time}</div>` : ''}
              ${order.notes ? `
                <div class="customer-notes-box">
                  <strong>Catatan:</strong> ${order.notes}
                </div>
              ` : ''}
            </div>

            <!-- Col 2: Order Items & Total -->
            <div class="col-items-info">
              <div class="items-list-box">
                <div class="items-section-title">Pesanan</div>
                ${(order.items || []).map(item => {
                  if (item.isBundle && item.bundleItems) {
                    return `
                      <div style="margin-bottom: 6px;">
                        <div class="item-line-row">
                          <span class="item-line-name">${item.productName}</span>
                          <span class="item-line-price">${formatRupiah(item.totalPrice)}</span>
                        </div>
                        <div class="bundle-breakdown-box">
                          <div class="bundle-breakdown-title">Catatan:</div>
                          ${item.bundleItems.map((bItem, bIdx) => `
                            <div class="bundle-breakdown-row">${bIdx + 1}. ${bItem.name}${bItem.isDrink ? ' — ' + (bItem.sugar || 'Normal Sugar') : ''}${bItem.isRawanStok ? ' ⚠rawan stok' : ''}</div>
                          `).join('')}
                        </div>
                      </div>
                    `;
                  } else {
                    return `
                      <div class="item-line-row">
                        <span class="item-line-name">• ${item.productName} ${item.isRawanStok ? '⚠rawan stok' : ''}</span>
                        <span class="item-line-qty">x${item.quantity || 1}</span>
                        <span class="item-line-price">${formatRupiah(item.totalPrice)}</span>
                      </div>
                    `;
                  }
                }).join('')}
              </div>

              <div class="order-total-box">
                <div class="order-total-label">Total Pesanan</div>
                <div class="order-total-amount">${formatRupiah(order.total_price)}</div>
                <span class="payment-method-badge">Metode Pembayaran: ${order.payment_method || 'QRIS'}</span>
              </div>
            </div>

            <!-- Col 3: Actions Column -->
            <div class="col-actions">
              ${renderActionButtons(order, waUrl)}
            </div>

          </div>

        </div>
      `;
    }

    function renderActionButtons(order, waUrl) {
      if (order.status === 'BELUM_DIPROSES') {
        return `
          <button class="btn-admin-action-primary btn-start-process" data-id="${order.order_id}">
            ▶️ Mulai Diproses
          </button>
          <a href="${waUrl}" target="_blank" class="btn-admin-action-wa">
            💬 Chat WhatsApp
          </a>
        `;
      } else if (order.status === 'DIPROSES') {
        if (order.receipt_url) {
          return `
            <div class="receipt-preview-box">
              <img src="${order.receipt_url}" alt="Receipt" class="receipt-thumb-img" />
              <div class="receipt-timestamp">Diunggah ${formatDateDisplay(order.receipt_uploaded_at || order.created_at)}</div>
            </div>
            <button class="btn-admin-action-blue btn-mark-done" data-id="${order.order_id}">
              ✅ Tandai Sudah Diproses
            </button>
            <label class="btn-admin-action-outline" style="text-align: center; cursor: pointer;">
              🔄 Ganti Receipt
              <input type="file" class="input-receipt-file" data-id="${order.order_id}" accept="image/png, image/jpeg" style="display: none;" />
            </label>
          `;
        } else {
          return `
            <label class="receipt-upload-dropzone">
              <i data-feather="upload-cloud" class="upload-icon-cloud"></i>
              <div class="upload-dropzone-text">Klik untuk upload foto receipt</div>
              <div class="upload-dropzone-sub">PNG / JPG maks. 5MB</div>
              <input type="file" class="input-receipt-file" data-id="${order.order_id}" accept="image/png, image/jpeg" style="display: none;" />
            </label>
            <button class="btn-admin-action-blue btn-mark-done" data-id="${order.order_id}">
              Tandai Sudah Diproses
            </button>
          `;
        }
      } else {
        // SUDAH_DIPROSES / SELESAI
        return `
          <div class="receipt-preview-box">
            <img src="${order.receipt_url || 'https://via.placeholder.com/200x120?text=Bukti+Receipt'}" alt="Receipt" class="receipt-thumb-img" />
            <div class="receipt-timestamp">Diunggah ${formatDateDisplay(order.receipt_uploaded_at || order.created_at)}</div>
          </div>
          <button class="btn-admin-action-outline btn-view-full-receipt" data-url="${order.receipt_url || ''}">
            👁️ Lihat Full Receipt
          </button>
          <label class="btn-admin-action-green" style="text-align: center; cursor: pointer;">
            🔄 Ganti Receipt
            <input type="file" class="input-receipt-file" data-id="${order.order_id}" accept="image/png, image/jpeg" style="display: none;" />
          </label>
        `;
      }
    }

    function bindCardActions(container) {
      // Start processing button
      container.querySelectorAll('.btn-start-process').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          try {
            await updateOrderStatus(id, 'DIPROSES');
            
            // Auto switch active filter pill tab to DIPROSES
            currentFilter = 'DIPROSES';
            document.querySelectorAll('.filter-status-pill').forEach(b => {
              b.classList.toggle('active', b.getAttribute('data-status-filter') === 'DIPROSES');
            });

            adminOrders = await fetchAllOrders();
            renderDashboardStats();
            renderOrdersList();
          } catch (err) {
            alert("Gagal memproses pesanan:\n" + err.message);
          }
        });
      });

      // Upload file receipt
      container.querySelectorAll('.input-receipt-file').forEach(input => {
        input.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          if (file.size > 5 * 1024 * 1024) {
            alert("Ukuran file maksimal 5MB!");
            return;
          }
          const id = input.getAttribute('data-id');
          try {
            await uploadReceiptImage(id, file);

            currentFilter = 'DIPROSES';
            document.querySelectorAll('.filter-status-pill').forEach(b => {
              b.classList.toggle('active', b.getAttribute('data-status-filter') === 'DIPROSES');
            });

            adminOrders = await fetchAllOrders();
            renderDashboardStats();
            renderOrdersList();
          } catch (err) {
            alert("Gagal mengunggah foto receipt:\n" + err.message);
          }
        });
      });

      // Mark done button
      container.querySelectorAll('.btn-mark-done').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          try {
            await updateOrderStatus(id, 'SUDAH_DIPROSES');

            // Auto switch active filter pill tab to SUDAH_DIPROSES
            currentFilter = 'SUDAH_DIPROSES';
            document.querySelectorAll('.filter-status-pill').forEach(b => {
              b.classList.toggle('active', b.getAttribute('data-status-filter') === 'SUDAH_DIPROSES');
            });

            adminOrders = await fetchAllOrders();
            renderDashboardStats();
            renderOrdersList();
          } catch (err) {
            alert("Gagal memperbarui status pesanan:\n" + err.message);
          }
        });
      });

      // View full receipt button
      container.querySelectorAll('.btn-view-full-receipt').forEach(btn => {
        btn.addEventListener('click', () => {
          const url = btn.getAttribute('data-url');
          if (url) {
            document.getElementById('lightbox-receipt-img').src = url;
            document.getElementById('modal-full-receipt').classList.add('active');
          }
        });
      });
    }

    function setupEvents() {
      // Filter status pills
      document.querySelectorAll('.filter-status-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-status-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.getAttribute('data-status-filter');
          renderOrdersList();
        });
      });

      // Search input
      const searchInput = document.getElementById('admin-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.trim();
          renderOrdersList();
        });
      }

      // Sort select
      const sortSelect = document.getElementById('admin-sort-select');
      if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
          sortOrder = e.target.value;
          renderOrdersList();
        });
      }

      // Lightbox close
      document.getElementById('btn-close-receipt-modal').addEventListener('click', () => {
        document.getElementById('modal-full-receipt').classList.remove('active');
      });
      document.getElementById('btn-close-receipt-modal-2').addEventListener('click', () => {
        document.getElementById('modal-full-receipt').classList.remove('active');
      });
    }

    window.addEventListener('DOMContentLoaded', initAdminApp);
  </script>
</body>
</html>
